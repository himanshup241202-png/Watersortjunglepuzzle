name: Build Water Sort Jungle - Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf android-wrapper

          mkdir -p android-wrapper/app/src/main/java/com/watersortjungle/app
          mkdir -p android-wrapper/app/src/main/assets
          mkdir -p android-wrapper/app/src/main/res/values

          cat > android-wrapper/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WaterSortJungle"
          include(":app")
          EOF

          cat > android-wrapper/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android-wrapper/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android-wrapper/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.watersortjungle.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.watersortjungle.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../../release-key.jks")
                      storePassword "WaterSortJungleStore2026"
                      keyAlias "watersort"
                      keyPassword "WaterSortJungleStore2026"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

          cat > android-wrapper/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  android:label="Water Sort Jungle">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android-wrapper/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > android-wrapper/app/src/main/java/com/watersortjungle/app/MainActivity.java <<'EOF'
          package com.watersortjungle.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);

                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Find and extract HTML ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" \
            ! -path "./android-wrapper/*" \
            | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: HTML ZIP not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf website-files
          mkdir -p website-files

          unzip -o "$ZIP_FILE" -d website-files

      - name: Put HTML game inside APK
        shell: bash
        run: |
          set -e

          INDEX_FILE=$(find website-files \
            -type f -iname "index.html" | head -n 1 || true)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found inside ZIP."
            exit 1
          fi

          WEBSITE_ROOT=$(dirname "$INDEX_FILE")

          echo "Game files found in: $WEBSITE_ROOT"

          cp -R "$WEBSITE_ROOT"/. \
            android-wrapper/app/src/main/assets/

          test -f android-wrapper/app/src/main/assets/index.html

          echo ""
          echo "Files that will be included inside APK:"
          find android-wrapper/app/src/main/assets -type f | sort

      - name: Generate release signing key
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -alias watersort \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass WaterSortJungleStore2026 \
            -keypass WaterSortJungleStore2026 \
            -dname "CN=Water Sort Jungle, OU=Mobile, O=Water Sort Jungle, L=India, ST=India, C=IN"

          cp release-key.jks android-wrapper/release-key.jks

          echo "Release signing key created."

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e

          cd android-wrapper
          gradle wrapper --gradle-version 8.7

      - name: Build signed Release APK
        shell: bash
        run: |
          set -e

          cd android-wrapper

          chmod +x gradlew

          ./gradlew clean assembleRelease --no-daemon

      - name: Copy final APK
        shell: bash
        run: |
          set -e

          cp android-wrapper/app/build/outputs/apk/release/app-release.apk \
            Water-Sort-Jungle-Release-Signed.apk

          echo "=========================================="
          echo "SIGNED RELEASE APK CREATED"
          echo "=========================================="

          ls -lh Water-Sort-Jungle-Release-Signed.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            --verbose \
            Water-Sort-Jungle-Release-Signed.apk

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-Jungle-Release-Signed-APK
          path: Water-Sort-Jungle-Release-Signed.apk
          if-no-files-found: error

      - name: Upload signing key backup
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-Jungle-Signing-Key-BACKUP
          path: release-key.jks
          if-no-files-found: error
