name: Build Water Sort Jungle - Signed Release APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING PROJECT"
          echo "=========================================="

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Removing ALL old signing files..."

          find extracted -type f \( \
            -name "*.jks" -o \
            -name "*.keystore" -o \
            -name "*.p12" -o \
            -name "*.pfx" \
          \) -delete

          echo "Old signing files removed."

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINDING ANDROID PROJECT"
          echo "=========================================="

          SETTINGS_FILE=$(find extracted -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings file not found."
            find extracted -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Using Groovy Gradle."
          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Using Kotlin Gradle."
          else
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SETTING UP ANDROID SDK"
          echo "=========================================="

          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then

            wget -q \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              -O /tmp/android-tools.zip

            rm -rf /tmp/android-tools

            mkdir -p /tmp/android-tools

            unzip -q \
              /tmp/android-tools.zip \
              -d /tmp/android-tools

            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"

            cp -r \
              /tmp/android-tools/cmdline-tools/* \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          fi

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create Clean Release Keystore
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CREATING CLEAN KEYSTORE"
          echo "=========================================="

          rm -f water-sort-jungle-release.jks

          keytool -genkeypair \
            -keystore water-sort-jungle-release.jks \
            -storetype JKS \
            -storepass "WaterSortStore2026!" \
            -keypass "WaterSortKey2026!" \
            -alias "water-sort-jungle" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Water Sort Jungle, OU=Mobile, O=Water Sort Jungle, L=India, ST=Uttar Pradesh, C=IN"

          echo ""
          echo "Checking keystore..."

          keytool -list \
            -v \
            -keystore water-sort-jungle-release.jks \
            -storepass "WaterSortStore2026!" \
            -alias "water-sort-jungle"

          echo ""
          echo "KEYSTORE CHECK PASSED."

      - name: Check Release Configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING EXISTING RELEASE CONFIGURATION"
          echo "=========================================="

          if [ -f "app/build.gradle" ]; then
            grep -n "signingConfigs\|signingConfig\|buildTypes" app/build.gradle || true
          fi

          if [ -f "app/build.gradle.kts" ]; then
            grep -n "signingConfigs\|signingConfig\|buildTypes" app/build.gradle.kts || true
          fi

      - name: Clean Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE CLEAN"
          echo "=========================================="

          gradle clean

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING RELEASE APK"
          echo "=========================================="

          gradle assembleRelease \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/water-sort-jungle-release.jks" \
            -Pandroid.injected.signing.store.password="WaterSortStore2026!" \
            -Pandroid.injected.signing.key.alias="water-sort-jungle" \
            -Pandroid.injected.signing.key.password="WaterSortKey2026!"

      - name: Find Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINDING APK"
          echo "=========================================="

          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK generated."

            find app/build/outputs -type f 2>/dev/null || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p release

          cp "$APK_FILE" \
            release/Water-Sort-Jungle-Release-Signed.apk

          ls -lh release/Water-Sort-Jungle-Release-Signed.apk

      - name: Verify APK Signature
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=========================================="

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            release/Water-Sort-Jungle-Release-Signed.apk

          echo ""
          echo "=========================================="
          echo "SIGNATURE VERIFIED"
          echo "=========================================="

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-Jungle-Release-Signed
          path: ${{ env.PROJECT_DIR }}/release/Water-Sort-Jungle-Release-Signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-Jungle-Keystore-Backup
          path: ${{ env.PROJECT_DIR }}/water-sort-jungle-release.jks
          if-no-files-found: error
          retention-days: 30
