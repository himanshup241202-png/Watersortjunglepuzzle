name: Build Water Sort Jungle - Signed Release APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and Extract HTML Game ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINDING HTML GAME ZIP"
          echo "=========================================="

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" \
            ! -path "./android-wrapper/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: HTML ZIP not found."
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          echo "GAME ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

      - name: Find index.html
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINDING GAME INDEX.HTML"
          echo "=========================================="

          INDEX_FILE=$(find extracted -type f \
            \( -iname "index.html" -o -iname "index.htm" \) \
            | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found."
            echo ""
            echo "Files found inside ZIP:"
            find extracted -maxdepth 6 -type f | head -n 200
            exit 1
          fi

          GAME_ROOT=$(dirname "$INDEX_FILE")

          echo "INDEX FILE:"
          echo "$INDEX_FILE"

          echo "GAME ROOT:"
          echo "$GAME_ROOT"

          echo "GAME_ROOT=$GAME_ROOT" >> "$GITHUB_ENV"

      - name: Create Fresh Android WebView Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CREATING FRESH ANDROID PROJECT"
          echo "=========================================="

          rm -rf android-wrapper

          mkdir -p \
            android-wrapper/app/src/main/java/com/watersortjungle/app \
            android-wrapper/app/src/main/res/values \
            android-wrapper/app/src/main/assets

          python3 -c "import base64; from pathlib import Path; Path('android-wrapper/settings.gradle').write_bytes(base64.b64decode(''))"

          python3 -c "import base64; from pathlib import Path; Path('android-wrapper/build.gradle').write_bytes(base64.b64decode('cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguOC4yJyBhcHBseSBmYWxzZQp9Cg=='))"

          python3 -c "import base64; from pathlib import Path; Path('android-wrapper/gradle.properties').write_bytes(base64.b64decode('b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD1mYWxzZQphbmRyb2lkLm5vblRyYW5zaXRpdmVSQ2xhc3M9dHJ1ZQo='))"

          python3 -c "import base64; from pathlib import Path; Path('android-wrapper/app/build.gradle').write_bytes(base64.b64decode(''))"

          python3 -c "import base64; from pathlib import Path; Path('android-wrapper/app/src/main/AndroidManifest.xml').write_bytes(base64.b64decode(''))"

          python3 -c "import base64; from pathlib import Path; Path('android-wrapper/app/src/main/res/values/styles.xml').write_bytes(base64.b64decode(''))"

          python3 -c "import base64; from pathlib import Path; Path('android-wrapper/app/src/main/java/com/watersortjungle/app/MainActivity.java').write_bytes(base64.b64decode(''b64decode' if False else b''))"

          # Copy the complete HTML game into the APK assets folder.
          cp -a "$GAME_ROOT"/. android-wrapper/app/src/main/assets/

          if [ ! -f android-wrapper/app/src/main/assets/index.html ]; then
            echo "ERROR: index.html was not copied into APK assets."
            exit 1
          fi

          echo "Game files copied into Android assets."

          echo "=========================================="
          echo "GAME FILE COUNT"
          echo "=========================================="

          find android-wrapper/app/src/main/assets -type f | wc -l

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            wget -q \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              -O /tmp/android-tools.zip

            rm -rf /tmp/android-tools
            mkdir -p /tmp/android-tools

            unzip -q /tmp/android-tools.zip -d /tmp/android-tools

            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"

            cp -r \
              /tmp/android-tools/cmdline-tools/* \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          fi

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create Release Keystore
        working-directory: android-wrapper
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CREATING SIGNING KEY"
          echo "=========================================="

          rm -f water-sort-jungle-release.jks

          keytool -genkeypair \
            -keystore water-sort-jungle-release.jks \
            -storetype JKS \
            -storepass "WaterSortStore2026!" \
            -keypass "WaterSortKey2026!" \
            -alias "water-sort-jungle" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Water Sort Jungle, OU=Mobile, O=Water Sort Jungle, L=India, ST=Uttar Pradesh, C=IN"

          keytool -list \
            -keystore water-sort-jungle-release.jks \
            -storepass "WaterSortStore2026!" \
            -alias "water-sort-jungle"

          echo "KEYSTORE CREATED AND VERIFIED."

      - name: Build Signed Release APK
        working-directory: android-wrapper
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING REAL SIGNED RELEASE APK"
          echo "=========================================="

          gradle clean

          gradle assembleRelease --stacktrace

          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Copy Final APK
        working-directory: android-wrapper
        shell: bash
        run: |
          set -e

          APK_FILE=$(find app/build/outputs/apk/release \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Real APK was not created."
            exit 1
          fi

          mkdir -p release

          cp "$APK_FILE" \
            release/Water-Sort-Jungle-Release-Signed.apk

          echo "FINAL APK:"
          ls -lh release/Water-Sort-Jungle-Release-Signed.apk

      - name: Verify APK Is Real And Signed
        working-directory: android-wrapper
        shell: bash
        run: |
          set -e

          APK="release/Water-Sort-Jungle-Release-Signed.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK file is empty or missing."
            exit 1
          fi

          echo "APK size:"
          ls -lh "$APK"

          echo "Checking APK file type:"
          file "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo "=========================================="
          echo "REAL SIGNED APK VERIFIED"
          echo "=========================================="

      - name: Upload ONLY Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-Jungle-Release-Signed-APK
          path: android-wrapper/release/Water-Sort-Jungle-Release-Signed.apk
          if-no-files-found: error
          retention-days: 30
